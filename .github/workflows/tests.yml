# Tests à chaque push et Pull Request : unitaires + intégration, puis construction de l'image.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # même version que l'image python:3.12-slim
          cache: pip
      - name: Dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests unitaires et d'intégration
        run: python tests/run_tests.py unit integration
      - name: Rapport dans le résumé GitHub
        if: always()
        run: cat rapports-tests/dernier-rapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Rapports en pièce jointe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: rapports-tests/

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image Docker
        run: docker build --build-arg GIT_COMMIT=${GITHUB_SHA::7} -t prompteur-claude:ci .
